
name: Build RandomStuff

on:
  workflow_dispatch:
  push:
    paths:
      - 'RandomStuff_PRONTO_PARA_REPLIT_GERAR_JAR.zip'
      - '.github/workflows/build-mod.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract project
        run: |
          mkdir project
          unzip -q RandomStuff_PRONTO_PARA_REPLIT_GERAR_JAR.zip -d project
          WRAPPER="$(find project -type f -name gradlew -print -quit)"
          test -n "$WRAPPER"
          echo "GRADLE_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Build mod
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RandomStuff-JAR
          path: '**/build/libs/*.jar'
          if-no-files-found: error
