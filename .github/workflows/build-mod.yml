
name: Build RandomStuff

on:
  push:
    paths:
      - 'RandomStuff_CORRIGIDO.zip'
      - 'RandomStuff_PRONTO_PARA_REPLIT_GERAR_JAR.zip'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          for FILE in \
            RandomStuff_CORRIGIDO.zip \
            RandomStuff_PRONTO_PARA_REPLIT_GERAR_JAR.zip
          do
            if [ -f "$FILE" ]; then
              ZIP="$FILE"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "::error::ZIP do projeto não encontrado!"
            ls -la
            exit 1
          fi

          mkdir -p project

          echo "Extraindo: $ZIP"

          unzip -q "$ZIP" -d project \
            -x '*/assets_originais/*' \
               '*/assets_originais/**'

          WRAPPER="$(find project -type f -name gradlew -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::Gradle Wrapper não encontrado!"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          GRADLE_DIR="$(dirname "$WRAPPER")"

          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

          echo "Projeto extraído com sucesso!"
          echo "Diretório: $GRADLE_DIR"

      - name: Build Minecraft Mod
        shell: bash
        run: |
          set -euo pipefail

          cd "$GRADLE_DIR"

          chmod +x gradlew

          ./gradlew --no-daemon clean build --stacktrace

      - name: Verify generated JAR
        shell: bash
        run: |
          set -euo pipefail

          echo "Procurando arquivos JAR..."

          find project -type f -path '*/build/libs/*.jar' -print

          if ! find project -type f -path '*/build/libs/*.jar' | grep -q .; then
            echo "::error::Nenhum JAR foi gerado!"
            exit 1
          fi

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RandomStuff-JAR
          path: project/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
