
name: Build RandomStuff

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Extract project
        run: |
          set -e
          ZIP=""
          for f in RandomStuff_CORRIGIDO.zip RandomStuff_PRONTO_PARA_REPLIT_GERAR_JAR.zip; do
            if [ -f "$f" ]; then ZIP="$f"; break; fi
          done
          test -n "$ZIP"
          mkdir -p project
          unzip -q "$ZIP" -d project
          WRAPPER="$(find project -type f -name gradlew -print -quit)"
          test -n "$WRAPPER"
          echo "GRADLE_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Build mod
        run: |
          cd "$GRADLE_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon build

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RandomStuff-JAR
          path: project/**/build/libs/*.jar
          if-no-files-found: error
